<!doctype html><html><head><style>
body{margin:0;font-family:Inter,sans-serif;background:#F7F6F2;color:#1E2A38}
.row{display:grid;grid-template-columns:120px 1fr 1fr 160px;gap:24px;align-items:center;padding:28px 36px;border-bottom:1px solid #ddd}
.dark{background:#1E2A38;padding:18px;border-radius:10px}
.light{background:#fff;padding:18px;border-radius:10px}
h2{margin:0;font-size:22px} img.big{height:64px} .tiny{display:flex;gap:14px;align-items:end}
.tiny img{border-radius:8px;background:#fff;box-shadow:0 0 0 1px #ddd}
.wa{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px #ccc;overflow:hidden}
</style></head><body>
<div class="row"><h2>Option A<br><small style="font-weight:400;font-size:13px">Ridge H</small></h2><div class="light"><img class="big" src="logos/option-a.svg"></div><div class="dark"><img class="big" src="logos/option-a-dark.svg"></div><div class="tiny"><img src="logos/mark-a.svg" width="48"><img src="logos/mark-a.svg" width="24"><img src="logos/mark-a.svg" width="16"></div></div>
<div class="row"><h2>Option B<br><small style="font-weight:400;font-size:13px">Roof-sheet badge</small></h2><div class="light"><img class="big" src="logos/option-b.svg"></div><div class="dark"><img class="big" src="logos/option-b-dark.svg"></div><div class="tiny"><img src="logos/mark-b.svg" width="48"><img src="logos/mark-b.svg" width="24"><img src="logos/mark-b.svg" width="16"></div></div>
<div class="row"><h2>Option C<br><small style="font-weight:400;font-size:13px">Touch point</small></h2><div class="light"><img class="big" src="logos/option-c.svg"></div><div class="dark"><img class="big" src="logos/option-c-dark.svg"></div><div class="tiny"><img src="logos/mark-c.svg" width="48"><img src="logos/mark-c.svg" width="24"><img src="logos/mark-c.svg" width="16"></div></div>
</body></html>
